# Photographic HDRI variant of the quad room, using a real studio panorama.
name = "quad_room_photographic"
output = "scenes/quad_room_photographic.xml"

[render]
image_width = 1280
image_height = 720
samples_per_pixel = 8000
max_depth = 16

[draft_render]
image_width = 640
image_height = 360
samples_per_pixel = 384
max_depth = 10

[environment]
texture = "environments/studio_small_01_1k.hdr"
intensity = 1.15
rotation_degrees = 115.0

[film.tone_mapping]
exposure = 1.0
gamma = 2.2

[film.bloom]
threshold = 1.15
intensity = 0.05

[camera]
position = [0.0, 1.9, 7.8]
look_at = [0.0, 1.7, 0.8]
up = [0.0, 1.0, 0.0]
fov = 48.0
aperture = 0.0
focus_distance = 7.2

[[materials]]
id = "white"
type = "lambertian"
color = [0.64, 0.64, 0.62]

[[materials]]
id = "backdrop"
type = "lambertian"
color = [0.66, 0.64, 0.6]

