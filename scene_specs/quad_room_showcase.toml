name = "quad_room_showcase"
output = "scenes/quad_room_showcase.xml"

[render]
image_width = 1280
image_height = 720
samples_per_pixel = 3000
max_depth = 20

[draft_render]
image_width = 640
image_height = 360
samples_per_pixel = 128
max_depth = 10

[environment]
texture = "environments/studio_softboxes.hdr"
